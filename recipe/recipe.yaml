schema_version: 1

context:
  version: "0.5.0"

package:
  name: catsmoothing
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/catsmoothing/catsmoothing-${{ version }}.tar.gz
  sha256: 6db5751aed188eb9d4020abae7e070d08238b164e6124b32803ff74ef46f95b3

build:
  number: 0
  skip:
    - if: match(python, "<3.10")
      then: true

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - maturin >=1.4,<2.0
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - ${{ compiler("rust") }}
    - libclang
    - clang
    - cargo-bundle-licenses
  host:
    - python
    - maturin >=1.4,<2.0
    - pip
  run:
    - python
    - numpy >=2
    - shapely >=2

tests:
  - python:
      imports:
        - catsmoothing
      pip_check: true

about:
  summary: Smoothing Shapely geometries using Catmull-Rom spline
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/cheginit/catsmoothing

extra:
  recipe-maintainers:
    - cheginit
